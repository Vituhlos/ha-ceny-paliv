<!doctype html>
<!--
  Demo page for the Ceny paliv card: renders the real card file with a mock `hass`, no Home Assistant needed.
  Serve the repository root (python -m http.server 8765) and open /tools/card-demo.html?theme=dark&lang=cs&width=380
  Parameters: theme=light|dark, lang=en|cs, width=<px> (card width), compact=1, show=home,list, sort=price|distance|worth,
  cards=main,fuels,savings,compare,regions,stations,areas,road,big,changes,trend,chains,badges,feature (the cards to show, in this order;
  feature: a simplified tile with the price feature under it)
  The data is made up (no real stations of anyone's area).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceny paliv card demo</title>
<!-- the font loads without blocking the page: without the network the cards still render in a fallback font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --primary-color: #03a9f4; --text-primary-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272;
    --disabled-text-color: #bdbdbd; --disabled-color: #bdbdbd; --divider-color: rgba(0, 0, 0, 0.12);
    --primary-background-color: #fafafa; --card-background-color: #fff; --ha-card-background: #fff;
    --success-color: #43a047; --warning-color: #ffa600; --error-color: #db4437; --info-color: #039be5; --orange-color: #ff9800;
    --ha-card-border-radius: 12px; --ha-card-border-color: #e0e0e0; --ha-card-box-shadow: none;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --disabled-text-color: #6f6f6f; --disabled-color: #464646;
    --divider-color: rgba(225, 225, 225, 0.12); --primary-background-color: #111111; --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c; --ha-card-border-color: rgba(225, 225, 225, 0.12);
  }
  body { margin: 0; padding: 16px; background: var(--primary-background-color); font-family: Roboto, sans-serif; }
  #host { max-width: var(--w, 900px); display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
// the icons come from a CDN: without it the cards still render, only without icons
let mdi = {};
const timeout = new Promise((resolve, reject) => setTimeout(() => reject(new Error("timeout")), 3000));
try { mdi = await Promise.race([import("https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/+esm"), timeout]); } catch (err) { console.warn("demo: no icons", err); }
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'light';
const lang = q.get('lang') || 'en';
document.documentElement.dataset.theme = theme;
if (q.get('width')) document.documentElement.style.setProperty('--w', `${q.get('width')}px`);

// ha-icon: the Material Design Icons path by name (an unknown name stays empty, as in Home Assistant)
customElements.define('ha-icon', class extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  attributeChangedCallback() { this.render(); }
  connectedCallback() { this.render(); }
  render() {
    const name = (this.getAttribute('icon') || '').replace('mdi:', '');
    const key = 'mdi' + name.split('-').map((p) => p[0].toUpperCase() + p.slice(1)).join('');
    const path = mdi[key];
    // its own shadow root and style, like Home Assistant's (page styles do not reach into the card)
    if (!this.shadowRoot) this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `<style>:host { display: inline-flex; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); }
      svg { width: 100%; height: 100%; fill: currentColor; }</style>${path ? `<svg viewBox="0 0 24 24"><path d="${path}"/></svg>` : ''}`;
  }
});
// ha-card: the theme's card surface, drawn in its own shadow root like Home Assistant's
customElements.define('ha-card', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' }).innerHTML = `<style>:host { display: block; background: var(--ha-card-background);
      border: 1px solid var(--ha-card-border-color); border-radius: var(--ha-card-border-radius); box-shadow: var(--ha-card-box-shadow);
      color: var(--primary-text-color); }</style><slot></slot>`;
  }
});

const today = new Date().toISOString().slice(0, 10);
const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
const LABELS = {
  en: { locale: 'en-GB', my_station: 'My station', updated_today: 'Updated today', updated_yesterday: 'Updated yesterday', today: 'Today', yesterday: 'Yesterday',
    chains_limited: "Nationwide average · cheapest {n} of {total}",
    cheapest_area: 'Cheapest in the area · #{rank} of {n} up-to-date stations', vs_cheapest: '+{d} vs cheapest ({name}) · #{rank} of {n}',
    cheapest_price: 'Cheapest {p} {unit}', stations_same: '{n} stations at this price', cheapest_badge: 'Cheapest',
    table_updated: 'Table updated {t} · next refresh {n}', arrows: 'Arrows: price vs yesterday', down: 'down', stable: 'stable', up: 'up',
    longpress: 'long-press a row for your station history', tap_station: 'tap a station for details and navigation',
    vs_yesterday: 'vs yesterday', source: 'Ceny: mbenzin.cz', e10_note: '(E10 not distinguished)', trends_start: 'Trends start tomorrow (first daily record: today)',
    chains_title: "Chain ranking", chains_sub: "Nationwide average price", chain_count: "Stations: {n}", chains_empty: "No current chain prices.", chains_more: "Show {n} more",
    since_partial: '* since {d} — history still filling', graph_title: 'Prices over 30 days', series_cheapest: 'Cheapest in the area', series_average: 'Area average', graph_empty: 'No history yet: it fills up day by day.', fuels_title: 'Fuel prices', mine_short: 'mine {p}', savings_title: 'A full tank', fill_up: '{n} {u} fill-up', save_at: 'At {name} you save {d} Kč', mine_cheapest: 'Your station is the cheapest', save_vs_avg: 'At {name} {d} Kč less than at the average price', drive_extra: '{km} km more there and back ≈ {d} Kč', worth_yes: 'worth it: you still save {d} Kč', worth_no: 'not worth the drive', compare_title: 'Price comparison', compare_sub: 'average prices in {unit}, against the country', compare_area: 'Area', compare_region: 'Region', compare_country: 'Czech Republic', compare_ranks: 'The {n} regions, cheapest first', regions_title: 'Regions', regions_sub: 'average price by region; tap a region', regions_loading: 'Loading the map…', regions_source: 'Boundaries: ČÚZK', map_title: 'Stations', map_sub: '{n} up-to-date prices; tap a station', map_center: 'Centre of the area', areas_title: 'Areas', areas_sub: 'the cheapest first', road_title: 'On the road', road_gps_only: 'Only a GPS area knows how far its stations are: choose one in the card editor.', history_error: 'Could not load history. Retrying…', changes_title: 'What changed', changes_empty: 'No price changes in the last {n} days.', ev_favourite_cheaper: 'Your station got cheaper', ev_favourite_dearer: 'Your station got dearer', ev_cheapest_cheaper: 'A cheaper station in the area', trend_title: 'Price trend', sort: 'Order', sort_price: 'Price', sort_distance: 'Distance', sort_worth: 'Worth it', with_drive: '≈ {p} with the drive', navigate: 'Navigate', close: 'Close', rank_of: '#{rank} of {n}',
    more_than_cheapest: '+{d} vs the cheapest', no_recent: 'No recent prices' },
  cs: { locale: 'cs-CZ', my_station: 'Moje stanice', updated_today: 'Aktualizováno dnes', updated_yesterday: 'Aktualizováno včera', today: 'Dnes', yesterday: 'Včera',
    chains_limited: "Průměr v Česku · nejlevnějších {n} z {total}",
    cheapest_area: 'Nejlevnější v okolí · {rank}. z {n} aktuálních stanic', vs_cheapest: '+{d} oproti nejlevnější ({name}) · {rank}. z {n}',
    cheapest_price: 'Nejlevnější {p} {unit}', stations_same: '{n} stanic má tuto cenu', cheapest_badge: 'Nejlevnější',
    table_updated: 'Tabulka aktualizována {t} · další aktualizace {n}', arrows: 'Šipky: cena oproti včerejšku', down: 'klesá', stable: 'beze změny', up: 'roste',
    longpress: 'dlouhým stisknutím řádku zobrazíte historii vaší stanice', tap_station: 'klepnutím na stanici zobrazíte podrobnosti a navigaci',
    vs_yesterday: 'oproti včerejšku', source: 'Ceny: mbenzin.cz', e10_note: '(E10 se nerozlišuje)', trends_start: 'Trendy se objeví zítra (první denní záznam: dnes)',
    chains_title: "Žebříček řetězců", chains_sub: "Průměrná cena v Česku", chain_count: "Počet stanic: {n}", chains_empty: "Aktuální ceny řetězců nejsou k dispozici.", chains_more: "Zobrazit další ({n})",
    since_partial: '* od {d} — historie se teprve plní', graph_title: 'Ceny za 30 dní', series_cheapest: 'Nejlevnější v oblasti', series_average: 'Průměr oblasti', graph_empty: 'Zatím bez historie: plní se den po dni.', fuels_title: 'Ceny paliv', mine_short: 'moje {p}', savings_title: 'Plná nádrž', fill_up: 'natankování {n} {u}', save_at: 'U {name} ušetříte {d} Kč', mine_cheapest: 'Vaše stanice je nejlevnější', save_vs_avg: 'U {name} o {d} Kč méně než za průměrnou cenu', drive_extra: 'o {km} km delší cesta tam a zpět ≈ {d} Kč', worth_yes: 'vyplatí se: i tak ušetříte {d} Kč', worth_no: 'nevyplatí se dojet', compare_title: 'Srovnání cen', compare_sub: 'průměrné ceny v {unit}, proti celé republice', compare_area: 'Oblast', compare_region: 'Kraj', compare_country: 'Česko', compare_ranks: '{n} krajů od nejlevnějšího', regions_title: 'Kraje', regions_sub: 'průměrná cena podle krajů; klepněte na kraj', regions_loading: 'Načítám mapu…', regions_source: 'Hranice: ČÚZK', map_title: 'Stanice', map_sub: '{n} aktuálních cen; klepněte na stanici', map_center: 'Střed oblasti', areas_title: 'Oblasti', areas_sub: 'od nejlevnější', road_title: 'Na cestě', road_gps_only: 'Vzdálenost stanic zná jen GPS oblast: vyberte ji v editoru karty.', history_error: 'Historii se nepodařilo načíst. Zkusím to znovu…', changes_title: 'Co se změnilo', changes_empty: 'Za posledních {n} dní se ceny nezměnily.', ev_favourite_cheaper: 'Vaše stanice zlevnila', ev_favourite_dearer: 'Vaše stanice zdražila', ev_cheapest_cheaper: 'Levnější stanice v oblasti', trend_title: 'Vývoj ceny', sort: 'Řazení', sort_price: 'Cena', sort_distance: 'Vzdálenost', sort_worth: 'Vyplatí se', with_drive: '≈ {p} i s cestou', navigate: 'Navigovat', close: 'Zavřít', rank_of: '{rank}. z {n}',
    more_than_cheapest: '+{d} oproti nejlevnější', no_recent: 'Žádné aktuální ceny' },
}[lang];

const trend = (delta, days) => ({ dir: delta < 0 ? 'down' : delta > 0 ? 'up' : 'flat', delta, ref_date: new Date(Date.now() - days * 86400000).toISOString().slice(0, 10), ref_price: 0 });
function station(rank, name, street, city, price, km, date, trends, home = false) {
  // placed at the stated distance from the area's centre (49.2, 16.62), each in another direction
  const bearing = rank * 1.3; const lat = Math.round((49.2 + km / 110.574 * Math.cos(bearing)) * 1e4) / 1e4;
  const lng = Math.round((16.62 + km / (111.32 * Math.cos(49.2 * Math.PI / 180)) * Math.sin(bearing)) * 1e4) / 1e4;
  return { rank, name, title: `${name} · ${street || city}`, chain: name, street, city, address: `${street}, ${city}`, price, lat, lng,
    updated: date === today ? 'Dnes' : 'Včera', updated_date: date, maps: `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,
    home, distance_km: km, trends };
}
function fuelStates(fuel, label, base) {
  const stations = [
    station(1, 'Benzina', 'Karlovarská 12', 'Brno', base, 3.2, today, { 1: trend(-0.3, 1), 2: trend(-0.5, 2), 7: trend(-0.9, 7), 14: trend(-1.1, 14), 30: trend(-1.6, 30) }),
    station(2, 'Shell', 'Vídeňská 88', 'Brno', base + 0.4, 5.9, today, { 1: trend(0, 1), 7: trend(0.2, 7) }),
    station(3, 'Lhota Oil', '', 'Lhota', base + 0.6, 11.4, yesterday, {}, true),
    station(4, 'MOL', 'Hlavní 1', 'Bochov', base + 0.8, 14.0, today, { 1: trend(0.3, 1) }),
    station(5, 'Orlen', 'Nádražní 5', 'Kunštát', base + 0.9, 18.7, today, { 1: trend(-0.1, 1) }),
  ];
  const id = 'demo-area';
  const states = {};
  states[`sensor.ceny_paliv_${fuel}_top5`] = { state: String(base), last_updated: new Date().toISOString(), attributes: {
    cp_fuel: fuel, cp_role: 'top5', cp_config_id: id, fuel, fuel_label: label, unit_of_measurement: 'Kč/l', city_name: lang === 'cs' ? 'GPS okolí' : 'GPS area',
    stations, home: stations[2], labels: LABELS, language: lang, max_age_days: 1, logos: [],
    fetched_at: new Date().toISOString(), next_update: new Date(Date.now() + 6 * 3600000).toISOString(),
    gps_area: { method: 'home', radius_km: 20, station_count: 16, latitude: 49.2, longitude: 16.62 }, excluded: 2,
    gps_nearest_stations: [
      { name: 'Robin Oil', city: 'Brno', address: 'Lesní 3, Brno', price: base + 1.1, lat: 49.205, lng: 16.625, updated: 'Dnes', updated_date: today, distance_km: 0.7 },
      { name: 'Eurooil', city: 'Brno', address: 'Polní 9, Brno', price: base + 0.7, lat: 49.215, lng: 16.63, updated: 'Dnes', updated_date: today, distance_km: 1.9 },
      { ...stations[0] },
    ] } };
  states[`sensor.ceny_paliv_${fuel}_home`] = { state: String(base + 0.6), last_updated: new Date().toISOString(), attributes: {
    cp_fuel: fuel, cp_role: 'home', cp_config_id: id, station: stations[2].title, price: base + 0.6, unit_of_measurement: 'Kč/l',
    latitude: stations[2].lat, longitude: stations[2].lng, distance_km: stations[2].distance_km,
    age_days: 1, updated_date: yesterday, rank: 3, fresh_count: 14, vs_cheapest: 0.6, cheapest_name: 'Benzina',
    trends: { 1: trend(0, 1), 2: trend(-0.2, 2), 7: trend(0.4, 7) } } };
  // made-up averages of the 14 regions (the real codes and names, invented prices)
  const names = [['CZ010', 'Hlavní město Praha'], ['CZ020', 'Středočeský kraj'], ['CZ031', 'Jihočeský kraj'], ['CZ032', 'Plzeňský kraj'],
    ['CZ041', 'Karlovarský kraj'], ['CZ042', 'Ústecký kraj'], ['CZ051', 'Liberecký kraj'], ['CZ052', 'Královéhradecký kraj'],
    ['CZ053', 'Pardubický kraj'], ['CZ063', 'Kraj Vysočina'], ['CZ064', 'Jihomoravský kraj'], ['CZ071', 'Olomoucký kraj'],
    ['CZ072', 'Zlínský kraj'], ['CZ080', 'Moravskoslezský kraj']];
  const regions = names.map(([code, name], i) => ({ code, name, average: Math.round((base + 0.55 + Math.sin(i * 1.7) * 0.4 + (code === 'CZ010' ? 0.5 : 0)) * 100) / 100, station_count: 100 + i * 9 }))
    .sort((x, y) => x.average - y.average).map((r, i) => ({ ...r, rank: i + 1 }));
  const country = Math.round(regions.reduce((t, r) => t + r.average, 0) / regions.length * 100) / 100;
  const own = regions.find((r) => r.code === 'CZ064');
  states[`sensor.ceny_paliv_${fuel}_national_average`] = { state: String(country), last_updated: '', attributes: {
    cp_fuel: fuel, cp_role: 'national_average', cp_config_id: id, unit_of_measurement: 'Kč/l', median: country, station_count: 2114, chains: [{ name: "Lhota Oil", average: base, station_count: 12 }, { name: "Brno Oil", average: base + 0.6, station_count: 18 }], regions } };
  states[`sensor.ceny_paliv_${fuel}_region_average`] = { state: String(own.average), last_updated: '', attributes: {
    cp_fuel: fuel, cp_role: 'region_average', cp_config_id: id, unit_of_measurement: 'Kč/l', region: own.name, region_code: own.code, rank: own.rank } };
  states[`sensor.ceny_paliv_${fuel}_area_average`] = { state: String(base + 0.9), last_updated: '', attributes: {
    cp_fuel: fuel, cp_role: 'area_average', cp_config_id: id, unit_of_measurement: 'Kč/l', station_count: 14,
    region: own.name, region_rank: own.rank, vs_national: Math.round((base + 0.9 - country) * 100) / 100, vs_region: Math.round((base + 0.9 - own.average) * 100) / 100 } };
  stations.forEach((s, i) => { states[`sensor.ceny_paliv_${fuel}_${i + 1}`] = { state: String(s.price), last_updated: '', attributes: {
    cp_fuel: fuel, cp_role: 'position', cp_index: i + 1, cp_config_id: id, station: s.title, price: s.price, latitude: s.lat, longitude: s.lng } }; });
  return states;
}

const states = { ...fuelStates('n95', 'Natural 95', 38.5), ...fuelStates('diesel', 'Diesel', 43.5) };
states['event.ceny_paliv_n95_price_change'] = { state: new Date().toISOString(), last_changed: '', attributes: { cp_fuel: 'n95', cp_role: 'price_change', cp_config_id: states['sensor.ceny_paliv_n95_top5'].attributes.cp_config_id, event_types: ['favourite_cheaper', 'favourite_dearer', 'cheapest_cheaper'] } };
const hass = { states, language: lang, locale: { language: lang, number_format: 'language', time_format: 'language', time_zone: 'local' },
  themes: { darkMode: theme === 'dark' }, config: { time_zone: 'Europe/Prague', latitude: 49.2, longitude: 16.62 }, entities: {},
  // 30 days of made-up daily statistics: the favourite, the area's cheapest (daily minimum) and its average;
  // the cheapest starts later, as after an upgrade, and one day of the favourite is missing
  callWS: async (msg) => {
    if (msg.type === 'history/history_during_period') {
      // made-up price-change events of the last days, in the recorder's compressed form
      const hour = (back) => (Date.now() - back * 3600000) / 1000;
      return { [msg.entity_ids[0]]: [
        { s: 'x', a: { event_type: 'favourite_dearer', station: 'Lhota Oil · Lhota', price: 39.1, change: 0.2 }, lu: hour(80) },
        { s: 'x', a: { event_type: 'cheapest_cheaper', station: 'Benzina · Karlovarská', price: 38.5, change: -0.3 }, lu: hour(30) },
        { s: 'x', a: { event_type: 'favourite_cheaper', station: 'Lhota Oil · Lhota', price: 38.9, change: -0.2 }, lu: hour(6) },
      ] };
    }
    const out = {};
    const noon = new Date(); noon.setHours(12, 0, 0, 0);
    for (const id of msg.statistic_ids) {
      const base = id.includes('diesel') ? 43.5 : 38.5;
      const rows = [];
      for (let back = 30; back >= 0; back -= 1) {
        const wave = Math.sin(back / 4) * 0.35 + back * 0.02;
        if (id.endsWith('_top5') && back > 18) continue;
        if (id.endsWith('_home') && back === 9) continue;
        const v = id.endsWith('_top5') ? base - 0.1 + wave : id.includes('average') ? base + 0.8 + wave * 0.8 : base + 0.5 + wave * 1.2;
        rows.push({ start: noon.getTime() - back * 86400000, mean: Math.round(v * 100) / 100, min: Math.round((v - 0.05) * 100) / 100 });
      }
      out[id] = rows;
    }
    return out;
  } };

// the integration serves the region boundaries; here they come straight from the repository
const realFetch = window.fetch.bind(window);
window.fetch = (url, ...rest) => realFetch(String(url).startsWith('/ceny_paliv_static/regions.json') ? '../custom_components/ceny_paliv/regions.json' : url, ...rest);

const s = document.createElement('script');
s.src = '../custom_components/ceny_paliv/frontend/ceny-paliv-card.js';
s.onload = () => {
  const main = { type: 'custom:ceny-paliv-card', fuel: 'n95', fuels: ['n95', 'diesel'], show: (q.get('show') || 'home,list,graph').split(',') };
  if (q.get('compact')) main.compact = true;
  if (q.get('sort')) main.sort = q.get('sort');
  const configs = { main, chains: { type: "custom:ceny-paliv-chains-card", fuel: "n95" }, fuels: { type: 'custom:ceny-paliv-fuels-card' }, savings: { type: 'custom:ceny-paliv-savings-card', fuel: 'n95' },
    compare: { type: 'custom:ceny-paliv-compare-card', fuel: 'n95' }, regions: { type: 'custom:ceny-paliv-regions-card', fuel: 'n95' },
    stations: { type: 'custom:ceny-paliv-stations-map-card', fuel: 'n95' }, areas: { type: 'custom:ceny-paliv-areas-card', fuel: 'n95' },
    road: { type: 'custom:ceny-paliv-road-card', fuel: 'n95' }, big: { type: 'custom:ceny-paliv-big-card', fuel: 'n95' },
    changes: { type: 'custom:ceny-paliv-changes-card', fuel: 'n95' }, trend: { type: 'custom:ceny-paliv-trend-card', fuel: 'n95' } };
  window.demoCards = {};
  for (const name of (q.get('cards') || 'main').split(',')) {
    if (name === 'badges') {
      const row = document.createElement('div');
      row.style.cssText = 'display: flex; flex-wrap: wrap; gap: 8px';
      for (const price of ['cheapest', 'mine', 'area']) {
        const badge = document.createElement('ceny-paliv-badge');
        badge.setConfig({ type: 'custom:ceny-paliv-badge', fuel: 'n95', price });
        row.appendChild(badge);
        badge.hass = hass;
      }
      document.getElementById('host').appendChild(row);
      continue;
    }
    if (name === 'feature') {
      // a stand-in for Home Assistant's tile card: the entity's name and state, the feature under it
      for (const role of ['top5', 'home', 'area_average']) {
        const id = `sensor.ceny_paliv_n95_${role}`;
        const tile = document.createElement('ha-card');
        tile.style.cssText = 'padding: 12px; display: flex; flex-direction: column; gap: 12px; font: 14px Roboto, sans-serif';
        tile.innerHTML = `<div><b>${role}</b> · ${hass.states[id].state} Kč/l</div>`;
        const feature = document.createElement('ceny-paliv-price-feature');
        feature.setConfig({ type: 'custom:ceny-paliv-price-feature' });
        feature.hass = hass;
        feature.context = { entity_id: id };
        tile.appendChild(feature);
        document.getElementById('host').appendChild(tile);
      }
      continue;
    }
    const config = configs[name];
    if (!config) continue;
    const card = document.createElement(config.type.replace('custom:', ''));
    card.setConfig(config);
    document.getElementById('host').appendChild(card);
    card.hass = hass;
    window.demoCards[name] = card;
  }
  window.demoCard = window.demoCards.main;
};
document.body.appendChild(s);
</script>
</body>
</html>
