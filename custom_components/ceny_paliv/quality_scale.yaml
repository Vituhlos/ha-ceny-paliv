# Home Assistant integration quality scale: progress towards Platinum.
# The official badge exists only for integrations in Home Assistant core, so this is a self-assessment against the
# same rules (https://developers.home-assistant.io/docs/core/integration-quality-scale/rules). Keep it honest:
# a rule is `done` only when the code and a test show it; `exempt` needs a reason; everything else is `todo`.
# Baseline 2026-11-13 (0.5.3 + #27): tests cover 96 % of the integration, the config flow 94 %.
rules:
  # Bronze
  action-setup:
    status: done
    comment: ceny_paliv.refresh is registered in async_setup (services.py), so it exists before any entry loads.
  appropriate-polling:
    status: done
    comment: One nationwide download per fuel every 6 hours, shared by all entries with the same key.
  brands:
    status: done
    comment: Icons ship in custom_components/ceny_paliv/brand/ (Home Assistant 2026.3+).
  common-modules:
    status: done
    comment: The coordinator is in coordinator.py, the base entity in entity.py.
  config-flow-test-coverage:
    status: done
    comment: >-
      Every line of config_flow.py is covered (tests/test_config_flow.py and test_integration.py); two branch
      partials of the favourite bookkeeping remain.
  config-flow:
    status: done
    comment: >-
      Setup is UI-only, the key is in data and the rest in options, and every field has a data_description in
      English and Czech (test_every_setting_field_has_a_description).
  dependency-transparency:
    status: todo
    comment: The mBenzin client is inside the integration; it moves to the aiombenzin library on PyPI (0.7).
  docs-actions:
    status: done
    comment: README "Actions" (and the Czech README) describes ceny_paliv.refresh, its field and its errors.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: README "Removing the integration" (and the Czech README), including the logo folder.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; the coordinator's zone listener is removed with the entry.
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: has_entity_name = True in entity.py; names come from translation keys under the area device.
  runtime-data: done
  test-before-configure:
    status: done
    comment: The key is checked with a real download before the entry is created.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh raises ConfigEntryNotReady when no fuel can be loaded.
  unique-config-entry:
    status: done
    comment: A city can be configured once; GPS areas get their own id because several areas are a feature.
  docs-triggers:
    status: exempt
    comment: No device triggers.
  docs-conditions:
    status: exempt
    comment: No device conditions.

  # Silver
  action-exceptions:
    status: done
    comment: >-
      ServiceValidationError for a missing, foreign or stopped area; HomeAssistantError naming what could not be
      refreshed (tests/test_services.py).
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README "Settings" table describes every option of Configure.
  docs-installation-parameters:
    status: done
    comment: README "Settings" table describes every setup field, the access key included.
  entity-unavailable:
    status: done
    comment: >-
      A fuel that cannot be refreshed makes its sensors unavailable (entity.py); every fuel failing raises
      UpdateFailed. The card shows the last known states meanwhile.
  integration-owner:
    status: done
    comment: codeowners is @Vituhlos; documentation, issue tracker and logo pack point to this repository.
  log-when-unavailable:
    status: done
    comment: >-
      A failing fuel is logged once and its recovery once (coordinator.py); a full outage is logged by the
      DataUpdateCoordinator, which also logs the recovery.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in sensor.py; the coordinator does all the fetching.
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 98 % of the integration (pytest --cov, 2026-11-14); CI fails below 95 %.

  # Gold
  devices:
    status: done
    comment: One service device per config entry (area), named after the entry, manufacturer mBenzin.cz.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py: settings, coordinator state and per-fuel refresh summary; the key, GPS centre and favourite
      stations are redacted (tests/test_diagnostics.py downloads it through the HTTP API).
  discovery:
    status: exempt
    comment: mBenzin.cz is a web service; there is nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
    comment: examples/price_alert.yaml exists but the README does not present examples.
  docs-known-limitations:
    status: todo
  docs-supported-devices:
    status: exempt
    comment: A web service, not devices.
  docs-supported-functions:
    status: todo
    comment: The entities are listed, their attributes are not.
  docs-troubleshooting:
    status: todo
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: exempt
    comment: >-
      The only device is the area itself (a service device), created with its config entry; mBenzin.cz has no
      devices that could appear later. New fuels are entities on it, added when Configure reloads the entry.
  entity-category:
    status: done
    comment: >-
      The archived favourite sensor is a diagnostic entity; the price sensors are the integration's primary data,
      so they have no category.
  entity-device-class:
    status: exempt
    comment: Home Assistant has no device class for a price per litre or kilogram.
  entity-disabled-by-default:
    status: done
    comment: >-
      Archived favourites are disabled by default (only their statistics matter). The position sensors stay enabled:
      the card's map draws them.
  entity-translations:
    status: done
    comment: entity.sensor.* names in translations/en.json and cs.json, with {fuel} and {position} placeholders.
  exception-translations:
    status: done
    comment: >-
      Every HomeAssistantError the integration raises (UpdateFailed, ConfigEntryAuthFailed, the action's errors)
      uses a translation_key from the exceptions section of en.json and cs.json.
  icon-translations:
    status: done
    comment: icons.json; no entity sets _attr_icon.
  reconfiguration-flow:
    status: done
    comment: The access key can be replaced without losing settings or history.
  repair-issues:
    status: todo
  stale-devices:
    status: exempt
    comment: >-
      The only device is the area, removed with its config entry, so it cannot become stale. The sensors of a fuel
      removed in Configure are removed from the registry at setup (sensor.py).

  # Platinum
  async-dependency:
    status: todo
    comment: The client is async but not a separate library yet.
  inject-websession:
    status: todo
    comment: The integration passes Home Assistant's session; the library must accept it too.
  strict-typing:
    status: todo
