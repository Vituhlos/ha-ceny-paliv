name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.1.0"
            python: "3.12"
            requirements: requirements_test.txt
          - ha: "2026.10.4"
            python: "3.14"
            requirements: requirements_test_latest.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Run tests (quality scale test-coverage rule: at least 95 %)
        run: python -m pytest -q --cov=custom_components.ceny_paliv --cov-report=term-missing:skip-covered --cov-fail-under=95

  card:
    name: Lovelace card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check custom_components/ceny_paliv/frontend/ceny-paliv-card.js
      - name: Run card regression tests
        run: node --test tests/test_card.js

  lint:
    name: Lint and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Ruff (errors and likely bugs)
        run: |
          python -m pip install ruff==0.15.22
          ruff check --select E9,F,B custom_components tests script
      - name: Integration, card and manifest versions match
        run: |
          python - <<'EOF'
          import json, re, pathlib
          root = pathlib.Path("custom_components/ceny_paliv")
          manifest = json.loads((root / "manifest.json").read_text())["version"]
          const = re.search(r'CARD_VERSION = "([^"]+)"', (root / "const.py").read_text()).group(1)
          card = re.search(r"const CARD_VERSION = '([^']+)'", (root / "frontend/ceny-paliv-card.js").read_text()).group(1)
          assert manifest == const == card, (manifest, const, card)
          print("version", manifest)
          EOF
      - name: Quality scale file lists every rule
        run: |
          python -m pip install pyyaml==6.0.3
          python script/check_quality_scale.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-11

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # brands: icons ship in custom_components/ceny_paliv/brand/ (HA 2026.3+), not in home-assistant/brands;
          # topics/issues: repository settings of this fork, decided by the maintainer
          ignore: brands topics issues
