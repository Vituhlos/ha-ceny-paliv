name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.1.0"
            python: "3.12"
            requirements: requirements_test.txt
          - ha: "2026.10.4"
            python: "3.14"
            requirements: requirements_test_latest.txt
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Lovelace card regression tests
        run: node --test tests/test_card.js
