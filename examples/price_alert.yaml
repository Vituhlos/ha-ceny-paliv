# Optional: phone notification whenever the price at your usual station changes (any amount).
# Add it to configuration.yaml or to a package. In automations.yaml, paste only the list below the
# `automation:` line (from "- id:"), without that line and with two spaces less indentation. Replace:
#   - sensor.ceny_paliv_n95_home   -> the favourite-station sensor of the fuel you follow (n95, benzinplus, diesel,
#                                     dieselplus, lpg, cng, adblue). After choosing a different favourite station
#                                     the active sensor gets a new id (e.g. _home_2): check Settings → Entities.
#   - notify.mobile_app_YOUR_PHONE -> your own notify service
#   - /lovelace/fuel_n95           -> the URL path of the dashboard view that holds the card
automation:
  - id: ceny_paliv_price_alert_n95
    alias: Fuel — home station price change alert
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.ceny_paliv_n95_home
        not_from: ["unavailable", "unknown"]
        not_to: ["unavailable", "unknown"]
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state | float(0) != trigger.from_state.state | float(0) }}"
    actions:
      - variables:
          old: "{{ trigger.from_state.state | float }}"
          new: "{{ trigger.to_state.state | float }}"
      - action: notify.mobile_app_YOUR_PHONE
        data:
          title: "⛽ Fuel price {{ 'down' if new < old else 'up' }}"
          message: "{{ '%.2f' | format(new) }} — {{ '▼ −' if new < old else '▲ +' }}{{ '%.2f' | format((new - old) | abs) }} (was {{ '%.2f' | format(old) }})"
          data:
            url: /lovelace/fuel_n95
            clickAction: /lovelace/fuel_n95
